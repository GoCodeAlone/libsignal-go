#
# Rust compatibility harness: wraps upstream libsignal-protocol pinned to a
# fixed commit, exposing deterministic test-vector generation and a JSON-RPC
# interop loop. This is the behavioral reference oracle for the pure-Go port.
#
# The git dependency + isolated-workspace pattern mirrors upstream
# rust/protocol/cross-version-testing/Cargo.toml.

[package]
name = "rust-harness"
version = "0.1.0"
edition = "2021"

[package.metadata.libsignal]
upstream_tag = "v0.104.0"

# Prevent this crate from being pulled into any parent workspace.
[workspace]
members = ["."]

[dependencies]
# The oracle is pinned to the peeled v0.104.0 release commit. The annotated
# tag object is 03b9987415e6dcb3d83dfde6a16b52d2b59a7b44. The rand stack must
# match upstream's (rand 0.9 family) so a seeded
# ChaCha20Rng satisfies the rand_core 0.9 CryptoRng/RngCore bounds the libsignal
# APIs take.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "257105c55a7389ca6b1e85185e2769465e6729f1", package = "libsignal-protocol" }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", rev = "257105c55a7389ca6b1e85185e2769465e6729f1", package = "libsignal-account-keys" }
usernames = { git = "https://github.com/signalapp/libsignal", rev = "257105c55a7389ca6b1e85185e2769465e6729f1", package = "usernames" }
rand = "0.9"
rand_chacha = "0.9"
rand_core = "0.9"
# The upstream session API is async; the in-memory stores never actually pend,
# so the harness drives the futures synchronously via FutureExt::now_or_never —
# the same idiom upstream's own test support module uses.
futures-util = "0.3"
# Crypto primitives for the hkdf domain: the chain/root/message-key and
# pqxdh-secret derivations are pub(crate) upstream, so the harness reproduces
# them against the same crate versions, matching the v0.104.0 source.
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
serde_json = "1"
hex = "0.4"
uuid = "1"
# Minimal executor to drive upstream's async group_encrypt/group_decrypt and
# create/process_sender_key_distribution_message (over the synchronous in-memory
# store) to completion in the interop RPC dispatch and the groups vectors.
futures = "0.3"
# The incremental ML-KEM-768 KEM used by SPQR (the Stage-2 PQ ratchet). Pinned to
# EXACTLY the version SPQR v1.6.0 pulls in transitively (see Cargo.lock), so the
# graph has a single copy and the harness exercises the same byte layout the Go
# port targets. SPQR's own incremental_mlkem768 wrapper is pub(crate), so the
# harness calls libcrux's public `mlkem768::incremental` API directly and
# reproduces SPQR's issue-1275 endianness normalization inline (see
# gen_mlkem_incremental). This is the oracle-3 reference for T27 Slice 0b.
#
# We enable `incremental` + `mlkem768` explicitly rather than relying on
# SPQR/libsignal to turn them on transitively (Cargo unifies features, but our
# direct `mlkem768::incremental` calls must not depend on another crate's
# selection surviving an upstream change). We deliberately do NOT enable
# `simd128`/`simd256`: with the portable backend libcrux serializes the
# EncapsState i16s in correct little-endian, so the generated fixture is
# host-independent and free of the cryspen/libcrux#1275 byte-swap (which the Go
# port handles defensively regardless — see gen_mlkem_incremental).
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["incremental", "mlkem768", "alloc"] }
# The SPQR crate itself, pinned to the SAME rev libsignal pulls in transitively
# (git tag v1.6.0; exact commit recorded in Cargo.lock), with `test-utils`
# enabled. test-utils is a dependency-free feature flag that re-exports SPQR's
# otherwise pub(crate) `encoding` module (GF16 + the polynomial chunk
# encoder/decoder). The harness calls encoding::polynomial::PolyEncoder::chunk_at
# and the GF16 Mul/Div operators to capture golden BE-u16 chunk byte vectors and
# GF16 mul/div triples — oracle leg (c) for T27 Slice B, pinning the big-endian
# wire that the erasure property test alone cannot catch.
spqr = { git = "https://github.com/signalapp/SparsePostQuantumRatchet.git", tag = "v1.6.0", features = ["test-utils"] }
